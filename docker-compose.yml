version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: miyazakian
      POSTGRES_PASSWORD: password
      POSTGRES_DB: miyazakian_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    command: bash -c "bundle install && rails db:create && rails server -b 0.0.0.0"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://miyazakian:password@db:5432/miyazakian_development

volumes:
  postgres_data:
